<title>Cruscotto Commesse – prova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap">
<style>
/*
 * Token del Climosfera Design System (docs/design-system/colors_and_type.css),
 * con gli stessi nomi. Unica fonte dei valori grafici dell'app: app.css usa
 * solo questi token (direttamente o tramite gli alias in cima al file).
 *
 * Deroghe al DS, decise per l'app e spiegate in docs/sviluppo/grafica.md:
 * colori di stato (--stato-*), densità dei dati (--font-size-dati),
 * nessuna barra laterale destra.
 */
:root {
  /* Blu del marchio */
  --color-blue-primary: #0084d1; /* linee strutturali, pulsanti principali */
  --color-blue-secondary: #0082c2; /* hover, bordi tabella */

  /* Neutri */
  --color-black: #000000; /* tutto il testo */
  --color-grey-meta: #7c8392; /* metadati, etichette secondarie */
  --color-grey-table: #e6e6e6; /* fondo intestazioni, divisori */
  --color-white: #ffffff; /* sfondo: sempre */

  /* Interazione */
  --color-hover: #0082c2;
  --color-press-opacity: 0.85;

  /* Semantici del DS */
  --color-bg-page: var(--color-white);
  --color-bg-table: var(--color-grey-table);
  --color-bg-divider: var(--color-grey-table);
  --color-text-primary: var(--color-black);
  --color-text-meta: var(--color-grey-meta);
  --color-border-structure: var(--color-blue-primary);
  --color-border-table: var(--color-black);
  --color-cta-bg: var(--color-blue-primary);
  --color-cta-bg-hover: var(--color-blue-secondary);
  --color-cta-text: var(--color-white);
  --color-accent-line: var(--color-blue-primary);

  /* Deroga: colori di stato, solo come quadratino accanto a una parola
     ("in linea", "attenzione", "critico"), mai come fondo */
  --stato-ok: #1e7b3a;
  --stato-att: #b26a00;
  --stato-crit: #c62828;
  --stato-nd: var(--color-grey-meta);

  /* Tipografia: solo Lora */
  --font-family-base: 'Lora', Georgia, 'Times New Roman', serif;
  --font-size-h1: 1.25rem; /* titolo dell'app nella testata (DS: 2rem per documenti) */
  --font-size-h2: 1.5rem; /* titolo di pagina (DS: 1.75rem) */
  --font-size-h3: 1.125rem; /* titolo di pannello (DS: 1.375rem) */
  --font-size-body: 1rem; /* deroga densità: DS 1.125rem */
  --font-size-dati: 0.9375rem; /* deroga densità: tabelle di dati */
  --font-size-caption: 0.875rem;
  --font-size-meta: 0.8125rem;
  --font-weight-regular: 400;
  --font-weight-bold: 700;
  --line-height-heading: 1.2;
  --line-height-body: 1.5;
  --line-height-caption: 1.4;
  --letter-spacing-h1: 0.08em;

  /* Spaziature e geometria */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --border-radius-max: 4px;
  --border-radius-none: 0px;
  --border-width-accent: 2px;
  --border-width-table-outer: 3px;
  --border-width-table-inner: 1px;
  --transition: 150ms ease;
}

/*
 * Cruscotto commesse Climosfera: veste grafica del Climosfera Design System
 * (docs/design-system, regole e deroghe in docs/sviluppo/grafica.md).
 * Solo tema chiaro, sfondo bianco, font Lora self-hosted (public/fonts/lora.css),
 * nessuna ombra, raggi a 0, nessuna icona.
 */

/* Alias usati dalle viste e dai grafici SVG: puntano solo ai token del DS */
:root {
  color-scheme: light;
  --ground: var(--color-white);
  --surface: var(--color-white);
  --sunken: var(--color-grey-table);
  --ink: var(--color-black);
  --ink-2: var(--color-black);
  --ink-3: var(--color-grey-meta);
  --line: var(--color-grey-table);
  --accent: var(--color-blue-primary);
  --accent-ink: var(--color-white);
  --accent-soft: var(--color-grey-table);
  --good: var(--stato-ok);
  --warn: var(--stato-att);
  --crit: var(--stato-crit);
  /* serie dei grafici: PV grigio tratteggiato, EV blu, AC nero */
  --pv: var(--color-grey-meta);
  --ev: var(--color-blue-primary);
  --ac: var(--color-black);
  --sans: var(--font-family-base);
  --cond: var(--font-family-base);
  --mono: var(--font-family-base);
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-height: 100vh;
  background: var(--color-bg-page);
  color: var(--color-text-primary);
  font-family: var(--font-family-base);
  font-size: var(--font-size-body);
  line-height: var(--line-height-body);
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding-inline: var(--space-5);
  padding-block: 0 var(--space-7);
}
/* numeri allineati in colonna (Lora ha le cifre tabellari) */
.mono,
.num,
td.r,
.kpi .v {
  font-variant-numeric: tabular-nums lining-nums;
}
h1,
h2,
h3 {
  font-family: var(--font-family-base);
  margin: 0;
  line-height: var(--line-height-heading);
  color: var(--color-text-primary);
  text-wrap: balance;
}
h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-bold);
  text-transform: uppercase;
  letter-spacing: var(--letter-spacing-h1);
}
h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-bold);
  font-style: italic;
}
h3 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-regular);
  font-style: italic;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}
.eyebrow {
  font-size: var(--font-size-meta);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-text-meta);
}
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}
:focus-visible {
  outline: 2px solid var(--color-blue-primary);
  outline-offset: 2px;
}
a {
  color: var(--color-text-primary);
  text-decoration-color: var(--color-blue-primary);
  text-decoration-thickness: 2px;
  text-underline-offset: 3px;
  transition: color var(--transition);
}
a:hover {
  color: var(--color-hover);
}
hr {
  border: 0;
  border-top: var(--border-width-accent) solid var(--color-accent-line);
  margin: var(--space-5) 0;
}
[hidden] {
  display: none !important;
}
.skip {
  position: absolute;
  left: -9999px;
}
.skip:focus {
  left: var(--space-4);
  top: var(--space-2);
  z-index: 10;
  background: var(--color-white);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-black);
}

/* ---------- testata ---------- */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--color-white);
  border-bottom: var(--border-width-accent) solid var(--color-accent-line);
}
.top-in {
  max-width: 1180px;
  margin: 0 auto;
  padding-inline: var(--space-5);
  padding-block: var(--space-3) 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.brandrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2) var(--space-4);
  justify-content: space-between;
}
.brand {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
}
.brand a {
  color: inherit;
  text-decoration: none;
}
.brand small {
  color: var(--color-text-meta);
  font-size: var(--font-size-caption);
  font-style: italic;
}
/* marchio provvisorio del DS finché non arriva il logo vettoriale */
.marchio {
  display: inline-block;
  background: var(--color-blue-primary);
  color: var(--color-white);
  font-weight: var(--font-weight-bold);
  font-size: var(--font-size-meta);
  letter-spacing: 0.2em;
  padding: var(--space-1) var(--space-2);
  line-height: 1.4;
}
.sample {
  font-size: var(--font-size-meta);
  border: 1px solid var(--stato-att);
  padding: 2px var(--space-2);
}
.utente {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  font-size: var(--font-size-caption);
}
.utente form {
  margin: 0;
}
.avatar {
  display: inline-grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border: 1px solid var(--color-blue-primary);
  color: var(--color-black);
  font-weight: var(--font-weight-bold);
  font-size: var(--font-size-meta);
}
.ruolo {
  font-size: var(--font-size-meta);
  font-style: italic;
  color: var(--color-text-meta);
}
.tabs {
  display: flex;
  gap: var(--space-1);
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs a,
.tabs button {
  display: inline-block;
  background: none;
  border: 0;
  border-bottom: var(--border-width-accent) solid transparent;
  padding: var(--space-2) var(--space-3);
  color: var(--color-black);
  white-space: nowrap;
  text-decoration: none;
  font-size: var(--font-size-caption);
  transition:
    color var(--transition),
    border-color var(--transition);
}
.tabs a[aria-current='page'],
.tabs button[aria-selected='true'] {
  font-weight: var(--font-weight-bold);
  border-bottom-color: var(--color-blue-primary);
}
.tabs a:hover,
.tabs button:hover {
  color: var(--color-hover);
}
.tabs.commessa {
  border-top: 1px solid var(--color-grey-table);
}
.commessa-titolo {
  display: flex;
  gap: var(--space-3);
  align-items: baseline;
  flex-wrap: wrap;
  padding-top: var(--space-1);
  font-style: italic;
}
.commessa-titolo b {
  font-style: normal;
}
.stato-connessione {
  font-size: var(--font-size-meta);
  color: var(--color-text-meta);
}

/* ---------- pagina ---------- */
.view {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  padding-top: var(--space-5);
}
.head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-end;
  gap: var(--space-2) var(--space-5);
}
.head p {
  margin: var(--space-2) 0 0;
  max-width: 72ch;
}
.panel {
  background: var(--color-white);
  border: 1px solid var(--color-grey-table);
  padding: var(--space-4);
}
.panel-h {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--space-3);
  flex-wrap: wrap;
  margin-bottom: var(--space-3);
}
.panel-h .note {
  color: var(--color-text-meta);
  font-size: var(--font-size-caption);
  font-style: italic;
}
.grid2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr));
  gap: var(--space-5);
}
.foot {
  color: var(--color-text-meta);
  font-size: var(--font-size-caption);
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2) var(--space-5);
  justify-content: space-between;
  border-top: var(--border-width-accent) solid var(--color-accent-line);
  padding-top: var(--space-3);
  margin-top: var(--space-3);
}
.muted {
  color: var(--color-text-meta);
}

/* ---------- KPI ---------- */
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  border: 1px solid var(--color-black);
  overflow: hidden;
}
/* divisori interni: bordi a destra e sotto, spostati di 1 px fuori dal riquadro */
.kpi {
  background: var(--color-white);
  border-right: 1px solid var(--color-grey-table);
  border-bottom: 1px solid var(--color-grey-table);
  margin: 0 -1px -1px 0;
  padding: var(--space-3) var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}
.kpi .v {
  font-size: 1.625rem;
  font-weight: var(--font-weight-bold);
  line-height: 1.15;
}
.kpi .s {
  font-size: var(--font-size-caption);
  color: var(--color-text-meta);
}
.kpi .pill {
  align-self: flex-start;
}

/* ---------- stato (deroga: quadratino colorato + parola) ---------- */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: var(--font-size-caption);
  font-style: italic;
  color: var(--color-black);
  white-space: nowrap;
}
.pill::before {
  content: '';
  width: 8px;
  height: 8px;
  flex: none;
  background: var(--stato, var(--stato-nd));
}
.pill.plain::before {
  display: none;
}
.g {
  --stato: var(--stato-ok);
}
.w {
  --stato: var(--stato-att);
}
.c {
  --stato: var(--stato-crit);
}
.n {
  --stato: var(--stato-nd);
}

/* ---------- tabelle (deroga densità: divisori interni grigi) ---------- */
.tbl {
  overflow-x: auto;
}
table {
  border-collapse: collapse;
  width: 100%;
  min-width: 640px;
  border: var(--border-width-table-outer) double var(--color-border-table);
  font-size: var(--font-size-dati);
}
th {
  font-weight: var(--font-weight-bold);
  text-align: left;
  padding: var(--space-2) var(--space-3);
  background: var(--color-bg-table);
  border-bottom: 1px solid var(--color-black);
  white-space: nowrap;
}
td {
  padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--color-grey-table);
  vertical-align: middle;
}
tr:last-child td {
  border-bottom: 0;
}
td.r,
th.r {
  text-align: right;
  white-space: nowrap;
}
.code {
  font-weight: var(--font-weight-bold);
  white-space: nowrap;
}
tr.click {
  cursor: pointer;
}
tr.click:hover td {
  background: var(--color-grey-table);
}

/* ---------- pulsanti ---------- */
.btn {
  display: inline-block;
  font: inherit;
  font-size: var(--font-size-caption);
  font-weight: var(--font-weight-bold);
  font-style: italic;
  line-height: 1.3;
  text-decoration: none;
  background: var(--color-white);
  color: var(--color-blue-primary);
  border: var(--border-width-accent) solid var(--color-blue-primary);
  border-radius: var(--border-radius-none);
  padding: 5px var(--space-3);
  cursor: pointer;
  transition:
    background-color var(--transition),
    color var(--transition),
    opacity var(--transition);
}
a.btn {
  text-decoration: none;
}
.btn:hover {
  background: var(--color-blue-primary);
  color: var(--color-white);
}
.btn:active {
  opacity: var(--color-press-opacity);
}
.btn.primary {
  background: var(--color-cta-bg);
  color: var(--color-cta-text);
  border-color: var(--color-cta-bg);
}
.btn.primary:hover {
  background: var(--color-cta-bg-hover);
  border-color: var(--color-cta-bg-hover);
}
.btn.ghost {
  border-color: transparent;
  background: none;
  color: var(--color-black);
  font-weight: var(--font-weight-regular);
  text-decoration: underline;
  text-decoration-color: var(--color-blue-primary);
  text-decoration-thickness: 2px;
  text-underline-offset: 3px;
}
.btn.ghost:hover {
  color: var(--color-hover);
  background: none;
}
.btn:disabled,
.btn[aria-disabled='true'] {
  opacity: 0.45;
  cursor: not-allowed;
}
.toggle {
  display: inline-flex;
  border: 1px solid var(--color-black);
}
.toggle button {
  border: 0;
  background: var(--color-white);
  padding: var(--space-1) var(--space-3);
  font-size: var(--font-size-caption);
}
.toggle button + button {
  border-left: 1px solid var(--color-black);
}
.toggle button[aria-pressed='true'].yes {
  background: var(--color-blue-primary);
  color: var(--color-white);
  font-weight: var(--font-weight-bold);
}
.toggle button[aria-pressed='true'].no {
  background: var(--color-black);
  color: var(--color-white);
  font-weight: var(--font-weight-bold);
}

/* ---------- moduli ---------- */
label {
  font-size: var(--font-size-caption);
}
select,
input[type='text'],
input[type='number'],
input[type='email'],
input[type='password'],
input[type='date'],
textarea {
  font: inherit;
  font-size: var(--font-size-caption);
  background: var(--color-white);
  color: var(--color-black);
  border: 1px solid var(--color-grey-meta);
  border-radius: var(--border-radius-none);
  padding: 5px var(--space-2);
}
select:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--color-blue-primary);
  outline-offset: 0;
  border-color: var(--color-blue-primary);
}
input[type='date'] {
  color-scheme: light;
}
textarea {
  width: 100%;
}
input:disabled,
select:disabled,
textarea:disabled {
  background: var(--color-grey-table);
  cursor: not-allowed;
}
.errore-campo {
  color: var(--stato-crit);
  font-size: var(--font-size-caption);
  font-style: italic;
}
input[aria-invalid='true'],
select[aria-invalid='true'],
textarea[aria-invalid='true'] {
  border: 2px solid var(--stato-crit);
}
fieldset {
  border: 1px solid var(--color-grey-table);
  padding: var(--space-3);
  margin: 0;
}
fieldset legend {
  font-size: var(--font-size-caption);
  font-style: italic;
  padding: 0 var(--space-1);
}
.campi {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3) var(--space-4);
  align-items: end;
}
.campi label {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}
.impostazioni {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}
.impostazione {
  border: 1px solid var(--color-grey-table);
  padding: var(--space-3);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  background: var(--color-white);
}
.impostazione .chiave {
  font-size: var(--font-size-meta);
  color: var(--color-text-meta);
}
/* deroga: la password temporanea si legge meglio con caratteri a larghezza fissa */
.password-temporanea {
  font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  font-size: 15px;
  user-select: all;
}

/* ---------- messaggi e toast ---------- */
.messaggio {
  padding: var(--space-3);
  display: flex;
  gap: var(--space-3);
  align-items: baseline;
  background: var(--color-white);
  border: 1px solid var(--color-grey-table);
  border-left: 4px solid var(--stato-nd);
}
.messaggio.conflitto {
  border-left-color: var(--stato-att);
}
.messaggio.errore {
  border-left-color: var(--stato-crit);
}
.messaggio.ok {
  border-left-color: var(--stato-ok);
}
.messaggio p {
  margin: 0;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--space-5) + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--color-white);
  color: var(--color-black);
  border: 1px solid var(--color-black);
  border-top: var(--border-width-accent) solid var(--color-blue-primary);
  padding: var(--space-2) var(--space-4);
  font-size: var(--font-size-caption);
  max-width: calc(100% - 32px);
}
.segnaposto {
  border: 1px dashed var(--color-grey-meta);
  background: var(--color-white);
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.segnaposto p {
  margin: 0;
  max-width: 68ch;
}
.segnaposto .pill {
  align-self: flex-start;
}

/* ---------- milestone ---------- */
.ms {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 0;
}
.ms div {
  position: relative;
  padding: 18px var(--space-3) 0 0;
  border-top: var(--border-width-accent) solid var(--color-grey-table);
}
.ms div.done {
  border-top-color: var(--color-blue-primary);
}
.ms div::before {
  content: '';
  position: absolute;
  top: -6px;
  left: 0;
  width: 10px;
  height: 10px;
  background: var(--color-white);
  border: 2px solid var(--color-grey-meta);
}
.ms div.done::before {
  background: var(--color-blue-primary);
  border-color: var(--color-blue-primary);
}
.ms div.next::before {
  border-color: var(--color-blue-primary);
}
.ms b {
  display: block;
}
.ms span {
  font-size: var(--font-size-caption);
  color: var(--color-text-meta);
}

/* ---------- avvisi ---------- */
.alerts {
  display: flex;
  flex-direction: column;
  margin: 0;
  padding: 0;
  list-style: none;
}
.alerts li {
  display: flex;
  gap: var(--space-3);
  align-items: baseline;
  padding: var(--space-2) 0;
  border-bottom: 1px solid var(--color-grey-table);
}

/* ================= calcoli ================= */
const baseAppr=c=>c.baseline?(c.baseline.stato==="approvata"?c.baseline:c.baseline.precedente||null):null;
function oreCella(c,p,cod,lun){ return (((c.ore||{})[p]||{})[cod]||{})[lun]||[0,0,0,0,0]; }
function acDi(c,cod){ const e=c.elaborati.find(x=>x.cod===cod); let t=e?(e.acBase||0):0; Object.values(c.ore||{}).forEach(m=>{ const s=m[cod]; if(s) Object.values(s).forEach(a=>a.forEach(h=>t+=+h||0)); }); return t; }
function oreSettimana(c,cod,lun){ let t=0; Object.values(c.ore||{}).forEach(m=>{ ((m[cod]||{})[lun]||[]).forEach(h=>t+=+h||0); }); return t; }
function pvAlla(c,data){ const b=baseAppr(c); if(!b) return null; let pv=0; Object.values(b.righe).forEach(r=>{ let o=0; r.date.forEach((d,i)=>{ if(d&&d<=data) o=Math.max(o,i+1); }); pv+=r.bud*PESI[o]/100; }); return pv; }
/* come componiEvm: con baseline budget congelati e fuori baseline a budget 0 (solo AC); senza baseline PV n.d. */
function evElab(c,e){ const b=baseAppr(c); const bud=b?(b.righe[e.cod]?b.righe[e.cod].bud:0):e.bud; return bud*PESI[e.st]/100; }
function evm(c){
  const b=baseAppr(c); let ev=0,ac=0,bac=0;
  c.elaborati.forEach(e=>{ ev+=evElab(c,e); ac+=acDi(c,e.cod); if(!b) bac+=e.bud; });
  if(b) bac=Object.values(b.righe).reduce((s,r)=>s+r.bud,0);
  const pv=pvAlla(c,oggi());
  const spi=pv?ev/pv:null, cpi=ac?ev/ac:null, eac=cpi?bac/cpi:null;
  return {bac,ev,pv,ac,spi,cpi,eac,etc:eac===null?null:eac-ac,vac:eac===null?null:bac-eac,fuori:b?c.elaborati.filter(e=>!b.righe[e.cod]).length:0};
}
const pianoDi=(c,lun)=>(c.piani||{})[lun||lunedi(oggi())]||null;
function ppcDi(p){ if(!p||p.stato==="bozza") return null; if(p.stato==="promesso"&&p.impegni.every(i=>i.dopo||i.f===null)) return null; const im=p.impegni.filter(i=>!i.dopo); if(!im.length) return null; return Math.round(im.filter(i=>i.f===true).length/im.length*100); }
function storiaPPC(c){ const m=new Map(c.storiaPPC||[]); Object.entries(c.piani||{}).forEach(([w,p])=>{ if(p.stato==="chiuso"&&p.ppc!==null&&p.ppc!==undefined) m.set(w,p.ppc); }); return [...m.entries()].filter(([w])=>w<=lunedi(oggi())).sort((a,b)=>a[0]<b[0]?-1:1); }
function ppc4(c){ const s=storiaPPC(c).slice(-4); return s.length?Math.round(s.reduce((a,[,v])=>a+v,0)/s.length):null; }
function pcr(c){ const L=lunedi(oggi()),F=addG(L,6); const vs=(c.vincoli||[]).filter(v=>v.stato!=="annullato"&&v.entro>=L&&v.entro<=F); const r=vs.filter(v=>v.stato==="rimosso").length; return {n:vs.length,r,v:vs.length?Math.round(r/vs.length*100):null}; }
const bloccata=(c,id)=>(c.vincoli||[]).some(v=>v.stato==="aperto"&&v.att.includes(id));
const colDi=st=>COLS.findIndex(x=>x[2].includes(st));
const limite=(c,ci)=>COLS[ci][1]?c.wip[COLS[ci][1]]:null;
const eta=e=>Math.max(0,giorniTra(e.stDal||oggi(),oggi()));
const f1=x=>x===null||x===undefined||!isFinite(x)?"n.d.":x.toFixed(2).replace(".",",");
const f0=x=>x===null||x===undefined||!isFinite(x)?"n.d.":Math.round(x).toLocaleString("it-IT");
const fh=x=>(Math.round(x*100)/100).toLocaleString("it-IT");
const pct=x=>x===null||x===undefined?"n.d.":x+"%";
function tone(x){ return x===null||!isFinite(x)?"n":x>=0.95?"g":x>=0.85?"w":"c"; }

function passoAsse(max){ const r=max/4; const p=Math.pow(10,Math.floor(Math.log10(Math.max(r,1)))); return [1,2,2.5,5,10].map(k=>k*p).find(s=>s>=r)||r; }
function curvaS(c,h){
  if(!c.inizio||!c.fine) return `<p class="vuoto">La curva S compare quando la commessa ha le date di inizio e fine.</p>`;
  const L0=lunedi(oggi()); const sett=[]; for(let w=lunedi(c.inizio);w<=lunedi(c.fine);w=addG(w,7)) sett.push(w);
  if(sett.length<2) return `<p class="vuoto">Servono almeno due settimane tra inizio e fine.</p>`;
  const E=evm(c), b=baseAppr(c);
  const pvS=b?sett.map(w=>pvAlla(c,addG(w,4))):null;
  const pti=k=>sett.map((w,i)=>{ if(w>L0) return null; const s=w===L0?{ev:E.ev,ac:E.ac}:(c.storiaEVM||{})[w]; return s?[i,s[k]]:null; }).filter(Boolean);
  const evP=pti("ev"), acP=pti("ac");
  const vals=[E.bac,...(pvS||[]),...evP.map(p=>p[1]),...acP.map(p=>p[1])]; if(E.eac!==null&&E.eac<E.bac*1.4) vals.push(E.eac);
  const st=passoAsse(Math.max(1,...vals)), ymax=Math.ceil(Math.max(1,...vals)/st)*st;
  const Wd=1100,H=h||280,Lm=52,R=14,T=12,B=28,n=sett.length;
  const x=i=>Lm+i*(Wd-Lm-R)/(n-1), y=v=>T+(H-T-B)*(1-v/ymax);
  const path=pp=>pp.map(([i,v],k)=>`${k?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  let g=""; for(let v=0;v<=ymax+1e-9;v+=st){ g+=`<line class="gl" x1="${Lm}" x2="${Wd-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${Lm-6}" y="${y(v)+4}" text-anchor="end">${f0(v)}</text>`; }
  const salto=Math.max(1,Math.ceil(n/10)); let xl=""; sett.forEach((w,i)=>{ if(i%salto===0) xl+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${W(w)}</text>`; });
  const io=sett.indexOf(L0);
  return `<div class="tbl"><svg viewBox="0 0 ${Wd} ${H}" width="100%" style="min-width:640px" role="img" aria-label="Curva S: valore pianificato, guadagnato e costo effettivo in ore">${g}${xl}
    ${io>=0?`<line x1="${x(io)}" x2="${x(io)}" y1="${T}" y2="${H-B}" stroke="var(--ink-3)" stroke-dasharray="3 3"/><text x="${x(io)+4}" y="${T+10}" style="fill:var(--ink-2)">oggi</text>`:""}
    ${pvS?`<path d="${path(pvS.map((v,i)=>[i,v]))}" fill="none" stroke="var(--pv)" stroke-width="2" stroke-dasharray="5 4"/>`:""}
    ${acP.length?`<path d="${path(acP)}" fill="none" stroke="var(--ac)" stroke-width="2.25"/>`:""}
    ${evP.length?`<path d="${path(evP)}" fill="none" stroke="var(--ev)" stroke-width="2.5"/>`:""}
    ${io>=0?`<circle cx="${x(io)}" cy="${y(E.ev)}" r="4" fill="var(--ev)"/><circle cx="${x(io)}" cy="${y(E.ac)}" r="4" fill="var(--ac)"/>${E.pv!==null?`<circle cx="${x(io)}" cy="${y(E.pv)}" r="3.5" fill="var(--pv)"/>`:""}`:""}
  </svg></div>
  <div class="legend"><span><i style="background:var(--pv)"></i>PV pianificato ${f0(E.pv)} h</span><span><i style="background:var(--ev)"></i>EV guadagnato ${f0(E.ev)} h</span><span><i style="background:var(--ac)"></i>AC ore registrate ${f0(E.ac)} h</span><span class="muted">BAC ${f0(E.bac)} h</span></div>
  ${b?"":`<p class="hint">PV e SPI restano n.d. finché non approvi la baseline (scheda Avanzamento EVM).</p>`}`;
}
function graficoPPC(c,h){
  const dati=storiaPPC(c).slice(-8); const p=pianoDi(c);
  if(p&&p.stato==="promesso"){ const v=ppcDi(p); if(v!==null) dati.push([lunedi(oggi()),v]); }
  if(!dati.length) return `<p class="vuoto">Nessun piano chiuso finora: il PPC compare dopo il primo venerdì.</p>`;
  const Wd=520,H=h||220,L=36,R=10,T=14,B=26,n=Math.max(dati.length,4); const bw=(Wd-L-R)/n; const y=v=>T+(H-T-B)*(1-v/100);
  let g=""; [0,25,50,75,100].forEach(v=>{g+=`<line class="gl" x1="${L}" x2="${Wd-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;});
  const bars=dati.map(([w,v],i)=>{const last=i===dati.length-1; const bx=L+i*bw+bw*0.2; return `<rect x="${bx}" y="${y(v)}" width="${bw*0.6}" height="${Math.max(0,y(0)-y(v))}" rx="2" fill="${last?"var(--accent)":"var(--accent-soft)"}" ${last?"":`stroke="var(--accent)" stroke-width="1"`}/>
    <text x="${bx+bw*0.3}" y="${y(v)-5}" text-anchor="middle" style="fill:${last?"var(--ink)":"var(--ink-3)"}">${v}</text><text x="${bx+bw*0.3}" y="${H-8}" text-anchor="middle">${W(w)}</text>`;}).join("");
  return `<svg viewBox="0 0 ${Wd} ${H}" width="100%" role="img" aria-label="PPC per settimana, in percentuale">${g}${bars}</svg>`;
}
function pareto(c){
  const cnt={...(c.causeStoria||{})}; Object.values(c.piani||{}).forEach(p=>p.impegni.forEach(i=>{ if(i.f===false&&i.c) cnt[i.c]=(cnt[i.c]||0)+1; }));

function avvisi(c){

const val=id=>{ const e=document.getElementById(id); return e?e.value.trim():""; };
const numIt=s=>{ const t=String(s).trim().replace(",","."); return /^\d+(\.\d+)?$/.test(t)?Number(t):NaN; };
function analizzaImport(testo,c){
  const esist=new Set(c.elaborati.map(e=>e.cod.toUpperCase())), visti=new Map(), righe=[];
  testo.replace(/\r\n?/g,"\n").split("\n").forEach((ln,i)=>{
    if(!ln.trim()) return; const sep=ln.includes("\t")?"\t":";"; const cel=ln.split(sep).map(x=>x.trim().replace(/^"(.*)"$/s,"$1").trim());
    if(!righe.length&&((cel[0]||"").toLowerCase()==="codice")) return;
    const [cod="",t="",d="",b=""]=cel, err=[];
    if(cel.length<4) err.push("servono 4 colonne: codice; titolo; disciplina; budget ore");
    if(cel.length>4&&cel.slice(4).some(x=>x!=="")) err.push("troppe colonne");
    if(!cod) err.push("manca il codice"); else { const k=cod.toUpperCase(); if(esist.has(k)) err.push(`il codice ${cod} esiste già nella commessa`); if(visti.has(k)) err.push(`codice ${cod} ripetuto (già alla riga ${visti.get(k)})`); else visti.set(k,i+1); }
    if(!t) err.push("manca il titolo");
    let disc=""; if(!d) err.push("manca la disciplina"); else { const f=DISC.find(([k,n])=>k.toLowerCase()===d.toLowerCase()||n.toLowerCase()===d.toLowerCase()); if(!f) err.push(`disciplina "${d}" sconosciuta`); else disc=f[0]; }
    let bud=null; if(!b) err.push("manca il budget in ore"); else { const n=numIt(b); if(!isFinite(n)||n<=0) err.push(`budget "${b}" non valido`); else bud=n; }
    righe.push({n:i+1,cod,t,d:disc||d,bud,errori:err});
  });
  return {cid:c.id,testo,righe,errate:righe.filter(r=>r.errori.length).length};
}
function leggiOre(s){ s=String(s).trim(); if(!s) return 0; let m=s.match(/^(\d{1,2}):([0-5]\d)$/); if(m) return +m[1]+ +m[2]/60; const n=numIt(s); return isFinite(n)?n:NaN; }
async function cambiaStato(c,i,d){
  const e=c.elaborati[i], nuovo=e.st+d; if(nuovo<0||nuovo>5) return;
  let nota="";
  if(d<0){ const m=await chiedi({titolo:`Riportare ${e.cod} a "${STATI[nuovo]}"`,testo:"Per tornare indietro serve il motivo (per esempio i commenti del verificatore).",campo:"Motivo",ok:"Torna indietro"}); if(m===null) return; if(!m){ toast("Serve un motivo per tornare indietro"); return; } nota=` · motivo: ${m}`; }
  const da=colDi(e.st), a=colDi(nuovo), lim=limite(c,a);
  if(a!==da&&lim){ const n=c.elaborati.filter(x=>colDi(x.st)===a).length; if(n>=lim){ const m=await chiedi({titolo:`Limite WIP della colonna "${COLS[a][0]}"`,testo:`La colonna ha già ${n} elaborati su un limite di ${lim}. Prima di aprirne un altro, prova ad aiutare a chiudere quelli già lì. Se devi procedere, scrivi il motivo: resta nel registro attività.`,campo:"Motivo",ok:"Procedi comunque"}); if(m===null) return; if(!m){ toast("Serve un motivo per superare il limite WIP"); return; } nota+=` · oltre il limite WIP: ${m}`; } }
  e.st=nuovo; e.stDal=oggi(); salvaC(c,`${e.cod}: ${STATI[nuovo]}${nota}`); render();
  const E=evm(c); toast(`${e.cod}: ${STATI[nuovo].toLowerCase()} · EV ${f0(E.ev)} h, SPI ${f1(E.spi)}`);
}
function muovi(c,i,col){
  const e=c.elaborati[i], da=colDi(e.st); if(col===da) return;
  if(Math.abs(col-da)>1){ toast("Si sposta una colonna alla volta"); return; }
  const st=e.st+(col>da?1:-1);
  if(colDi(st)!==col){ toast(`${e.cod}: prima porta a termine "${STATI[st]}" con il pulsante Avanti`); return; }
  cambiaStato(c,i,col>da?1:-1);
}

  salvaSegnalazione({id:nuovoId("s"),quando:new Date().toISOString(),profilo:LOC.profilo,commessa:inC?c.codice:"",pagina:NOMI_TAB[LOC.tab]||LOC.tab,tipo:(document.querySelector('#seg-form input[name="tipo"]:checked')||{}).value||"",testo});
  render(); toast("Segnalazione registrata, grazie");
});

/* ================= avvio ================= */
async function avvia(){
  leggiLocale();
  if(window.claude&&typeof window.claude.use==="function"){
    MODO="attesa"; render();
    let db=null; try{ db=await window.claude.use("db"); }catch(e){}
    if(db){
      DB=db; MODO="condiviso"; DATI={commesse:{},segnalazioni:{}};
      let pronti=0; const fatto=()=>{ if(++pronti>=2){ CARICATO=true; } };
      let primoC=true, primoS=true;
      db.collection("commesse").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ if(d.exists){ const v=d.data(); if(v&&v.id) m[d.id]=v; } }); DATI.commesse=m; if(primoC){ primoC=false; fatto(); } richiediRender(); },
        e=>{ if(primoC){ primoC=false; fatto(); render(); } if(e&&e.code==="revoked"){ SOLA_LETTURA=true; } toast("Collegamento ai dati condivisi interrotto: ricarica la pagina"); });
      db.collection("segnalazioni").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ if(d.exists) m[d.id]=d.data(); }); DATI.segnalazioni=m; if(primoS){ primoS=false; fatto(); } richiediRender(); },()=>{ if(primoS){ primoS=false; fatto(); render(); } });
      render(); return;
    }
    MODO="locale";
  }
  if(!haDatiLocali){ DATI.commesse.esempio=creaEsempio(); salvaDatiLocali(); }
  render();
}
avvia();
</script>
