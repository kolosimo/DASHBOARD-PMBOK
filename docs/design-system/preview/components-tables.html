<!DOCTYPE html>
<!-- @dsCard group="Components" name="Data Table" subtitle="Double outer border, grey alternating rows, Tabella caption" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Lora'; src: url('../fonts/Lora-VariableFont_wght.ttf') format('truetype'); font-weight: 100 900; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Lora'; src: url('../fonts/Lora-VariableFont_wght.ttf') format('truetype'); font-weight: 100 900; font-style: italic; font-display: swap; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; font-family: 'Lora', Georgia, serif; padding: 24px 28px; }

  table {
    width: 100%;
    border-collapse: collapse;
    border: 3px double #000;
    font-family: 'Lora', Georgia, serif;
    font-size: 0.875rem;
  }
  th {
    font-weight: 700;
    background: #E6E6E6;
    border: 1px solid #000;
    padding: 8px 12px;
    text-align: left;
  }
  td {
    border: 1px solid #000;
    padding: 8px 12px;
    background: #fff;
  }
  tr:nth-child(even) td {
    background: #E6E6E6;
  }
  .table-caption {
    font-size: 0.75rem;
    font-style: italic;
    text-align: center;
    color: #000;
    margin-top: 6px;
    display: block;
  }
</style>
</head>
<body>
  <table>
    <thead>
      <tr>
        <th>Unità</th>
        <th>Portata aria [m³/h]</th>
        <th>Potenza frigorifera [kW]</th>
        <th>Potenza termica [kW]</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>UTA-01</td>
        <td>4.800</td>
        <td>28,5</td>
        <td>32,0</td>
      </tr>
      <tr>
        <td>UTA-02</td>
        <td>3.200</td>
        <td>19,0</td>
        <td>22,5</td>
      </tr>
      <tr>
        <td>UTA-03</td>
        <td>6.000</td>
        <td>35,0</td>
        <td>40,0</td>
      </tr>
    </tbody>
  </table>
  <span class="table-caption">Tabella 1: Unità di trattamento aria — dati di progetto</span>
</body>
</html>
