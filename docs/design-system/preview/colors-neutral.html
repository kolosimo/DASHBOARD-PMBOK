<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Neutral Palette" subtitle="Black · Grey Meta #7C8392 · Grey Table #E6E6E6 · White" viewport="700x150" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Lora'; src: url('../fonts/Lora-VariableFont_wght.ttf') format('truetype'); font-weight: 100 900; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Lora'; src: url('../fonts/Lora-VariableFont_wght.ttf') format('truetype'); font-weight: 100 900; font-style: italic; font-display: swap; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; font-family: 'Lora', Georgia, serif; padding: 20px; }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .swatch { flex: 1; display: flex; flex-direction: column; }
  .swatch-block { height: 72px; }
  .swatch-info { padding: 8px 0 0 0; }
  .swatch-name { font-size: 0.7rem; font-weight: 700; color: #000; letter-spacing: 0.06em; text-transform: uppercase; }
  .swatch-hex  { font-size: 0.65rem; color: #7C8392; font-style: italic; margin-top: 2px; }
  .swatch-use  { font-size: 0.6rem; color: #7C8392; margin-top: 3px; line-height: 1.3; }
</style>
</head>
<body>
  <div class="row">
    <div class="swatch">
      <div class="swatch-block" style="background:#000000; border:1px solid #e6e6e6;"></div>
      <div class="swatch-info">
        <div class="swatch-name">Black</div>
        <div class="swatch-hex">#000000</div>
        <div class="swatch-use">All body text · Headings · Sidebar text</div>
      </div>
    </div>
    <div class="swatch">
      <div class="swatch-block" style="background:#7C8392;"></div>
      <div class="swatch-info">
        <div class="swatch-name">Grey Meta</div>
        <div class="swatch-hex">#7C8392</div>
        <div class="swatch-use">Page numbers · Secondary labels</div>
      </div>
    </div>
    <div class="swatch">
      <div class="swatch-block" style="background:#E6E6E6; border:1px solid #ccc;"></div>
      <div class="swatch-info">
        <div class="swatch-name">Grey Table</div>
        <div class="swatch-hex">#E6E6E6</div>
        <div class="swatch-use">Table backgrounds · Dividers</div>
      </div>
    </div>
    <div class="swatch">
      <div class="swatch-block" style="background:#FFFFFF; border:1px solid #e6e6e6;"></div>
      <div class="swatch-info">
        <div class="swatch-name">White</div>
        <div class="swatch-hex">#FFFFFF</div>
        <div class="swatch-use">Page background — always</div>
      </div>
    </div>
  </div>
</body>
</html>
