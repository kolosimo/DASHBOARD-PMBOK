<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="colors_and_type.css">
<style>html,body{margin:0;padding:0}body{width:1280px;height:854px;display:grid;grid-template-columns:1fr 300px;font-family:'Lora',Georgia,serif;overflow:hidden}.mark{background:#0084D1;display:flex;align-items:center;justify-content:center}.mark span{color:#FFFFFF;font-size:150px;font-weight:600;letter-spacing:-0.02em;line-height:1;white-space:nowrap}.strip{display:grid;grid-template-rows:repeat(3,1fr)}.strip i{display:block}</style>
</head>
<body>
<div class="mark"><span>Climosfera</span></div>
<div class="strip"><i style="background:#7C8392"></i><i style="background:#0082C2"></i><i style="background:#000000"></i></div>
</body>
</html>
